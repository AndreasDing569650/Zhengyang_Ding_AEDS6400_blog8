<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Interactive Bootstrap Confidence Interval</title>
  <style>
        body {
          font-family: Arial, sans-serif;
          max-width: 1000px;
          margin: 30px auto;
          padding: 0 20px;
          color: #333333;
        }

        h1 {
          font-size: 28px;
          margin-bottom: 10px;
        }

        .description {
          color: #555555;
          margin-bottom: 25px;
          line-height: 1.5;
        }

        .controls {
          display: grid;
          grid-template-columns:
            repeat(auto-fit, minmax(210px, 1fr));
          gap: 20px;
          margin-bottom: 25px;
        }

        .control {
          padding: 15px;
          border: 1px solid #dddddd;
          border-radius: 8px;
        }

        label {
          display: block;
          font-weight: bold;
          margin-bottom: 8px;
        }

        input[type='range'] {
          width: 100%;
        }

        .value {
          margin-top: 6px;
          color: #555555;
        }

        #chart {
          width: 100%;
          height: 500px;
          border: 1px solid #dddddd;
          border-radius: 8px;
        }

        .results {
          margin-top: 20px;
          padding: 15px;
          background: #f5f5f5;
          border-radius: 8px;
          line-height: 1.7;
        }
        </style>
</head>
<html>
  <body>
    <h1>Interactive Bootstrap Confidence Interval</h1>
    <p class="description">
      Change the sample size, number of bootstrap samples, 
      confidence level, or true population mean to see how 
      the bootstrap distribution and confidence interval change.
    </p>
    <div class="controls">
      <div class="control">
        <label for="sampleSize">Sample Size</label>
        <input id="sampleSize" type="range" min="10" max="200" value="50" step="10"/>
        <div class="value">
          <span id="sampleSizeValue">50</span>
        </div>
      </div>
      <div class="control">
        <label for="bootstrapSamples">Bootstrap Samples</label>
        <input id="bootstrapSamples" type="range" min="100" max="5000" value="1000" step="100"/>
        <div class="value">
          <span id="bootstrapSamplesValue">1000</span>
        </div>
      </div>
      <div class="control">
        <label for="confidenceLevel">Confidence Level</label>
        <input id="confidenceLevel" type="range" min="0.80" max="0.99" value="0.95" step="0.01"/>
        <div class="value">
          <span id="confidenceLevelValue">95%</span>
        </div>
      </div>
      <div class="control">
        <label for="populationMean">True Population Mean</label>
        <input id="populationMean" type="range" min="20" max="80" value="50" step="1"/>
        <div class="value">
          <span id="populationMeanValue">50</span>
        </div>
      </div>
    </div>
    <div id="chart"></div>
    <div class="results">
      <div>
        <strong>Sample mean: </strong>
        <span id="sampleMean"></span>
      </div>
      <div>
        <strong>Confidence interval: </strong>
        <span id="confidenceInterval"></span>
      </div>
      <div>
        <strong>True population mean: </strong>
        <span id="trueMean"></span>
      </div>
    </div>
    <script>
        const sampleSize =
          document.getElementById('sampleSize');

        const bootstrapSamples =
          document.getElementById('bootstrapSamples');

        const confidenceLevel =
          document.getElementById('confidenceLevel');

        const populationMean =
          document.getElementById('populationMean');


        const sampleSizeValue =
          document.getElementById('sampleSizeValue');

        const bootstrapSamplesValue =
          document.getElementById('bootstrapSamplesValue');

        const confidenceLevelValue =
          document.getElementById('confidenceLevelValue');

        const populationMeanValue =
          document.getElementById('populationMeanValue');


        const sampleMeanOutput =
          document.getElementById('sampleMean');

        const confidenceIntervalOutput =
          document.getElementById('confidenceInterval');

        const trueMeanOutput =
          document.getElementById('trueMean');


        const chart =
          document.getElementById('chart');


        function randomNormal() {

          let u = 0;
          let v = 0;

          while (u === 0) {
            u = Math.random();
          }

          while (v === 0) {
            v = Math.random();
          }

          return Math.sqrt(
            -2.0 * Math.log(u)
          ) *
          Math.cos(
            2.0 * Math.PI * v
          );

        }


        function generateNormalSample(
          n,
          mean,
          sd
        ) {

          const result = [];

          for (let i = 0; i < n; i++) {

            result.push(
              mean +
              sd * randomNormal()
            );

          }

          return result;

        }


        function mean(values) {

          let total = 0;

          for (let i = 0; i < values.length; i++) {
            total += values[i];
          }

          return total / values.length;

        }


        function bootstrapSample(
          sample
        ) {

          const result = [];

          for (let i = 0; i < sample.length; i++) {

            const index = Math.floor(
              Math.random() * sample.length
            );

            result.push(
              sample[index]
            );

          }

          return result;

        }


        function quantile(
          values,
          probability
        ) {

          const sorted =
            values.slice().sort(
              (a, b) => a - b
            );

          const position =
            (sorted.length - 1) *
            probability;

          const lower =
            Math.floor(position);

          const upper =
            Math.ceil(position);

          if (lower === upper) {
            return sorted[lower];
          }

          return (
            sorted[lower] +
            (sorted[upper] -
              sorted[lower]) *
            (position - lower)
          );

        }


        function update() {

          const n =
            Number(sampleSize.value);

          const nBootstrap =
            Number(bootstrapSamples.value);

          const level =
            Number(confidenceLevel.value);

          const trueMean =
            Number(populationMean.value);


          sampleSizeValue.textContent =
            n;

          bootstrapSamplesValue.textContent =
            nBootstrap;

          confidenceLevelValue.textContent =
            Math.round(level * 100) + '%';

          populationMeanValue.textContent =
            trueMean;


          // Generate original sample

          const sample =
            generateNormalSample(
              n,
              trueMean,
              10
            );


          const sampleMean =
            mean(sample);


          // Generate bootstrap distribution

          const bootstrapMeans = [];


          for (
            let i = 0;
            i < nBootstrap;
            i++
          ) {

            const bootstrap =
              bootstrapSample(sample);

            bootstrapMeans.push(
              mean(bootstrap)
            );

          }


          // Calculate confidence interval

          const alpha =
            1 - level;

          const lower =
            quantile(
              bootstrapMeans,
              alpha / 2
            );

          const upper =
            quantile(
              bootstrapMeans,
              1 - alpha / 2
            );


          // Update numerical results

          sampleMeanOutput.textContent =
            sampleMean.toFixed(2);

          confidenceIntervalOutput.textContent =
            '[' +
            lower.toFixed(2) +
            ', ' +
            upper.toFixed(2) +
            ']';

          trueMeanOutput.textContent =
            trueMean;


          // Create histogram

          const bins = 40;

          const min =
            Math.min(...bootstrapMeans);

          const max =
            Math.max(...bootstrapMeans);

          const binWidth =
            (max - min) / bins;

          const counts =
            new Array(bins).fill(0);


          for (
            let i = 0;
            i < bootstrapMeans.length;
            i++
          ) {

            let index =
              Math.floor(
                (bootstrapMeans[i] - min) /
                binWidth
              );

            if (index >= bins) {
              index = bins - 1;
            }

            counts[index]++;

          }


          const maxCount =
            Math.max(...counts);


          let svg =
            '<svg ' +
            'viewBox="0 0 900 500" ' +
            'width="100%" ' +
            'height="100%" ' +
            'xmlns="http://www.w3.org/2000/svg">';


          // Axes

          svg +=
            '<line x1="70" y1="430" ' +
            'x2="850" y2="430" ' +
            'stroke="#333"/>';

          svg +=
            '<line x1="70" y1="50" ' +
            'x2="70" y2="430" ' +
            'stroke="#333"/>';


          // Histogram

          for (
            let i = 0;
            i < bins;
            i++
          ) {

            const barWidth =
              780 / bins;

            const barHeight =
              350 *
              counts[i] /
              maxCount;

            const x =
              70 +
              i * barWidth;

            const y =
              430 -
              barHeight;

            svg +=
              '<rect ' +
              'x="' + x + '" ' +
              'y="' + y + '" ' +
              'width="' + (barWidth - 1) + '" ' +
              'height="' + barHeight + '" ' +
              'fill="#9ecae1"/>';

          }


          function xPosition(value) {

            return (
              70 +
              (
                (value - min) /
                (max - min)
              ) * 780
            );

          }


          // Confidence interval boundaries

          const lowerX =
            xPosition(lower);

          const upperX =
            xPosition(upper);


          svg +=
            '<line x1="' +
            lowerX +
            '" y1="50" x2="' +
            lowerX +
            '" y2="430" ' +
            'stroke="#333" ' +
            'stroke-dasharray="6,6" ' +
            'stroke-width="2"/>';


          svg +=
            '<line x1="' +
            upperX +
            '" y1="50" x2="' +
            upperX +
            '" y2="430" ' +
            'stroke="#333" ' +
            'stroke-dasharray="6,6" ' +
            'stroke-width="2"/>';


          // Sample mean

          const sampleMeanX =
            xPosition(sampleMean);


          svg +=
            '<line x1="' +
            sampleMeanX +
            '" y1="50" x2="' +
            sampleMeanX +
            '" y2="430" ' +
            'stroke="#333" ' +
            'stroke-width="3"/>';


          // True population mean

          const trueMeanX =
            xPosition(trueMean);


          svg +=
            '<line x1="' +
            trueMeanX +
            '" y1="50" x2="' +
            trueMeanX +
            '" y2="430" ' +
            'stroke="#333" ' +
            'stroke-dasharray="2,5" ' +
            'stroke-width="3"/>';


          // Labels

          svg +=
            '<text x="450" y="30" ' +
            'text-anchor="middle" ' +
            'font-size="20">' +
            'Bootstrap Distribution' +
            '</text>';


          svg +=
            '<text x="450" y="475" ' +
            'text-anchor="middle" ' +
            'font-size="16">' +
            'Bootstrap Sample Mean' +
            '</text>';


          svg +=
            '</svg>';


          chart.innerHTML = svg;

        }


        sampleSize.addEventListener(
          'input',
          update
        );

        bootstrapSamples.addEventListener(
          'input',
          update
        );

        confidenceLevel.addEventListener(
          'input',
          update
        );

        populationMean.addEventListener(
          'input',
          update
        );


        update();
        </script>
  </body>
</html>
</html>
